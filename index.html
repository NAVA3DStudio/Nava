<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAVA Studio Portfolio</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg: #0f1115;
      --card: #161a22;
      --border: #2a2f3a;
      --text: #e6e6e6;
      --muted: #8a93a6;
      --accent: #7aa2ff;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px;
      -webkit-font-smoothing: antialiased;
    }
    [hidden] { display: none !important; }

    /* ---------- Login ---------- */
    .login {
      max-width: 420px;
      margin: 120px auto;
      background: var(--card);
      padding: 32px 24px;
      border-radius: 12px;
      text-align: center;
    }
    .login h1 { font-size: 24px; margin: 0 0 8px; }
    .login p { color: var(--muted); margin: 0 0 20px; }
    .login form { display: flex; gap: 8px; justify-content: center; }
    .login-error { color: #ff7a7a; font-size: 14px; min-height: 20px; margin-top: 12px; }
    .shake { animation: shake .35s; }
    @keyframes shake {
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    button, input { padding: 10px 12px; border-radius: 8px; border: none; font: inherit; }
    button { cursor: pointer; background: var(--accent); color: var(--bg); font-weight: 700; }
    button:hover { filter: brightness(1.1); }
    input {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      width: 200px;
    }
    input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- Layout ---------- */
    .wrap { max-width: 1400px; margin: 0 auto; }
    .topnav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 12px 0 20px;
      background: linear-gradient(var(--bg) 75%, transparent);
    }
    .topnav a {
      color: var(--text);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 14px;
      transition: border-color .2s, color .2s;
    }
    .topnav a:hover { border-color: var(--accent); color: var(--accent); }

    .card {
      background: var(--card);
      padding: 24px;
      border-radius: var(--radius);
      margin-bottom: 28px;
      scroll-margin-top: 80px;
    }
    .section-title { font-size: 24px; margin: 0 0 16px; color: var(--accent); }
    .project + .project { border-top: 1px solid var(--border); margin-top: 24px; padding-top: 24px; }
    .project-name { font-size: 28px; margin: 0 0 16px; font-weight: 600; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }
    .thumb {
      display: block;
      padding: 0;
      background: var(--bg);
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      cursor: zoom-in;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .thumb:hover, .thumb:focus-visible {
      transform: scale(1.03);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    img {
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ---------- Lightbox ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
      cursor: default;
    }
    .lb-btn {
      position: fixed;
      background: rgba(0,0,0,.5);
      color: #fff;
      border-radius: 8px;
      font-size: 32px;
      line-height: 1;
      padding: 14px 20px;
      transition: background .2s;
    }
    .lb-btn:hover { background: rgba(0,0,0,.85); filter: none; }
    .lb-prev { left: 20px; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 20px; top: 50%; transform: translateY(-50%); }
    .lb-close { top: 20px; right: 20px; font-size: 24px; padding: 10px 16px; }
    .lb-caption {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0,0,0,.6);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      white-space: nowrap;
      user-select: none;
    }
    .lb-caption .count { font-family: monospace; opacity: .7; margin-left: 8px; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1024px) {
      body { padding: 20px; }
      .grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .project-name { font-size: 22px; }
      .lb-prev, .lb-next { display: none; } /* на телефоне листаем свайпом */
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
      .login form { flex-direction: column; }
      input { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>

<section id="login" class="login">
  <h1>NAVA Studio Portfolio</h1>
  <p>Private NDA-safe portfolio</p>
  <form id="login-form" autocomplete="off">
    <input type="password" id="pw" placeholder="Password" aria-label="Password" autofocus>
    <button type="submit">Enter</button>
  </form>
  <div id="login-error" class="login-error" role="alert"></div>
</section>

<main id="content" class="wrap" hidden>
  <nav id="topnav" class="topnav" aria-label="Sections"></nav>
  <div id="gallery"></div>
</main>

<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lb-btn lb-close" data-action="close" aria-label="Close">✕</button>
  <button class="lb-btn lb-prev" data-action="prev" aria-label="Previous">◀</button>
  <img id="lb-img" src="" alt="" draggable="false">
  <button class="lb-btn lb-next" data-action="next" aria-label="Next">▶</button>
  <div class="lb-caption"><span id="lb-title"></span><span id="lb-count" class="count"></span></div>
</div>

<script>
/* =========================================================
   ДАННЫЕ ПОРТФОЛИО
   Чтобы добавить/убрать работу — правьте только этот список.
   Сетка, навигация и порядок в просмотрщике строятся сами.
   ========================================================= */
const range = (from, to, ext) =>
  Array.from({ length: to - from + 1 }, (_, i) => `${from + i}.${ext}`);
const shots = (prefix, nums, ext = "jpg") => nums.map(n => `${prefix}${n}.${ext}`);

const PORTFOLIO = [
  {
    section: "Skin",
    projects: [
      { name: "Binah",          images: range(1, 3, "gif") },
      { name: "Corona",         images: range(4, 6, "gif") },
      { name: "Corals",         images: range(7, 9, "gif") },
      { name: "Blücher",        images: range(10, 12, "gif") },
      { name: "Three Kingdoms", images: range(13, 16, "gif") },
    ],
  },
  {
    section: "Ships",
    projects: [
      { name: "NATO code Grisha class corvette (project 1124)",
        images: [1,2,3,4,5,6,7].map(n => `${n}_1124.jpg`) },
      { name: "Surcouf",             images: ["17.gif", "18.gif"] },
      { name: "August von Parseval", images: ["19.gif", "20.gif"] },
      { name: "Duncan",              images: ["25.gif", "26.gif"] },
      { name: "Utrecht",             images: ["27.gif", "28.gif"] },
      { name: "Provorny",            images: ["29.gif", "30.gif"] },
      { name: "Johnston",            images: ["31.gif", "32.gif"] },
      { name: "Annapolis",           images: ["21.gif", "22.gif"] },
      { name: "Kijkduin",            images: ["23.gif", "24.gif"] },
    ],
  },
  {
    section: "Tanks",
    projects: [
      { name: "E-50",          images: shots("E-50_",         [1,2,3,5]) },
      { name: "Su-152",        images: shots("Su-152_",       [1,2,3,5]) },
      { name: "Churchill VII", images: shots("Churchill_VII_",[1,2,3,5]) },
      { name: "Comet",         images: shots("Comet_",        [1,2,3,5]) },
      { name: "Wz-44",         images: shots("Wz_44_",        [1,2,3,5]) },
      { name: "Cruiser MK III",images: shots("Cruiser_MK3_",  [1,2,3,5]) },
      { name: "T64B",          images: shots("T64_",          [1,2,3,4], "gif") },
      { name: "Type 16 MCV",   images: range(40, 43, "jpg") },
    ],
  },
  {
    section: "Fighter",
    projects: [
      { name: "Eurofighter Typhoon", images: range(301, 307, "jpg") },
    ],
  },
  {
    section: "Vehicles",
    projects: [
      { name: "Collection", images: range(100, 107, "gif") },
    ],
  },
  {
    section: "Environment",
    projects: [
      { name: "Collection", images: range(200, 209, "gif") },
    ],
  },
];

/* =========================================================
   ВХОД
   ========================================================= */
const PASSWORD = "NAVA2026";
const AUTH_KEY = "nava_auth";

const $ = id => document.getElementById(id);

function unlock() {
  $("login").hidden = true;
  $("content").hidden = false;
  buildGallery();
}

$("login-form").addEventListener("submit", e => {
  e.preventDefault();
  const box = $("login");
  if ($("pw").value === PASSWORD) {
    try { sessionStorage.setItem(AUTH_KEY, "1"); } catch (_) {}
    unlock();
  } else {
    $("login-error").textContent = "Incorrect password";
    box.classList.remove("shake");
    void box.offsetWidth; // перезапуск анимации
    box.classList.add("shake");
    $("pw").select();
  }
});

try { if (sessionStorage.getItem(AUTH_KEY) === "1") unlock(); } catch (_) {}

/* =========================================================
   ГАЛЕРЕЯ
   ========================================================= */
const flat = []; // [{ src, title }] — общий порядок для просмотрщика
let built = false;

function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-"); }

function buildGallery() {
  if (built) return;
  built = true;

  const nav = $("topnav");
  const gallery = $("gallery");
  const navFrag = document.createDocumentFragment();
  const galFrag = document.createDocumentFragment();

  PORTFOLIO.forEach(({ section, projects }) => {
    const id = slug(section);

    const link = document.createElement("a");
    link.href = `#${id}`;
    link.textContent = section;
    navFrag.appendChild(link);

    const card = document.createElement("section");
    card.className = "card";
    card.id = id;
    card.innerHTML = `<h2 class="section-title">${section}</h2>`;

    projects.forEach(({ name, images }) => {
      const project = document.createElement("div");
      project.className = "project";
      project.innerHTML = `<h3 class="project-name">${name}</h3>`;

      const grid = document.createElement("div");
      grid.className = "grid";

      images.forEach((src, i) => {
        const index = flat.length;
        const title = projects.length > 1 || name !== "Collection" ? name : section;
        flat.push({ src, title });

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "thumb";
        btn.dataset.index = index;
        btn.setAttribute("aria-label", `${title} — image ${i + 1}`);

        const img = document.createElement("img");
        img.src = src;
        img.alt = `${title} ${i + 1}`;
        img.loading = "lazy";
        img.decoding = "async";
        img.draggable = false;

        btn.appendChild(img);
        grid.appendChild(btn);
      });

      project.appendChild(grid);
      card.appendChild(project);
    });

    galFrag.appendChild(card);
  });

  nav.appendChild(navFrag);
  gallery.appendChild(galFrag);

  // Один обработчик на всю галерею вместо сотни onclick
  gallery.addEventListener("click", e => {
    const t = e.target.closest(".thumb");
    if (t) openLightbox(+t.dataset.index);
  });
}

/* =========================================================
   ПРОСМОТРЩИК
   ========================================================= */
const lb = $("lightbox");
const lbImg = $("lb-img");
let current = 0;
let lastFocus = null;

function show(i) {
  current = (i + flat.length) % flat.length;
  const { src, title } = flat[current];
  lbImg.src = src;
  lbImg.alt = title;
  $("lb-title").textContent = title;
  $("lb-count").textContent = `${current + 1} / ${flat.length}`;
  // предзагрузка соседних кадров
  [current - 1, current + 1].forEach(n => {
    new Image().src = flat[(n + flat.length) % flat.length].src;
  });
}

function openLightbox(i) {
  lastFocus = document.activeElement;
  show(i);
  lb.hidden = false;
  document.body.style.overflow = "hidden";
  lb.querySelector(".lb-close").focus();
}

function closeLightbox() {
  lb.hidden = true;
  lbImg.src = "";
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}

lb.addEventListener("click", e => {
  const action = e.target.closest("[data-action]")?.dataset.action;
  if (action === "prev") return show(current - 1);
  if (action === "next") return show(current + 1);
  if (action === "close" || e.target === lb) closeLightbox();
});

// Свайпы на телефоне
let touchX = null;
lb.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
  touchX = null;
});

/* =========================================================
   КЛАВИАТУРА И ЗАЩИТА ОТ ПРОСТОГО СОХРАНЕНИЯ
   ========================================================= */
document.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey;
  if ((mod && e.key.toLowerCase() === "s") ||
      (mod && e.shiftKey && e.key.toLowerCase() === "i") ||
      e.key === "F12") {
    e.preventDefault();
    return;
  }
  if (lb.hidden) return;
  if (e.key === "ArrowLeft")  { e.preventDefault(); show(current - 1); }
  if (e.key === "ArrowRight") { e.preventDefault(); show(current + 1); }
  if (e.key === "Escape")     { e.preventDefault(); closeLightbox(); }
});

document.addEventListener("contextmenu", e => {
  if (e.target.tagName === "IMG") e.preventDefault();
});
document.addEventListener("dragstart", e => {
  if (e.target.tagName === "IMG") e.preventDefault();
});
</script>
</body>
</html>
